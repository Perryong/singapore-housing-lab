name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: JS tests
        run: |
          node test/sun.test.js
          node test/format_test.mjs
          node test/resale_ui_test.mjs
          node test/nearby_test.mjs
          node test/value_ui_test.mjs
          node test/sky_test.mjs
      - name: Python deps
        run: pip install pillow opencv-python-headless numpy pandas scikit-learn   # crop size check; 3D plan extractor unit test
      - name: Python tests
        env:
          PYTHONPATH: .
        # Parts that need HDB brochures/annexes or large data.gov.sg files (not in the repo) print "skipped".
        run: |
          python test/resale_test.py
          python test/prices_test.py
          python test/layouts_test.py
          python test/layouts_block_test.py
          python test/plan3d_test.py
          python test/plan3d_glb_test.py
          python test/value_test.py
      - name: Catalogue is up to date
        run: |
          node tools/make_index.js
          git diff --exit-code projects/index.json
