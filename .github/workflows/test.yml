name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Python deps
        # crop size check, 3D plan extractor unit test, browser smoke test
        run: |
          pip install pillow opencv-python-headless numpy pandas scikit-learn playwright
          playwright install --with-deps chromium
      - name: Tests
        # Parts that need HDB brochures/annexes or large data.gov.sg files (not in the repo) print "skipped".
        run: npm test
      - name: Catalogue is up to date
        run: |
          node tools/make_index.js
          git diff --exit-code projects/index.json
