<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Future BTO map: where Singapore's next BTO estates may be | BTOlab</title>
<link rel="canonical" href="https://singapore-housing-lab.vercel.app/web/future.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2712%27 fill=%27%23E8931C%27/%3E%3C/svg%3E">
<meta name="description" content="Land likely to become HDB BTO in the next 5 to 10 years, from URA Master Plan zoning and announced growth areas, with every score's reasons.">
<link rel="preload" href="fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
@font-face{font-family:"Schibsted Grotesk";font-weight:400 700;font-display:swap;src:url(fonts/schibsted-grotesk-latin.woff2) format("woff2")}
:root{--ink:#F4F7F6;--muted:#A9B6BB;--bg:#141C20;--glass:rgba(20,28,32,.88);--accent:#E8931C;--accent-ink:#2A1A00}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.4 "Schibsted Grotesk",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a,button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#map{position:fixed;inset:0;background:#1A2428;font:inherit}
.leaflet-tile-pane{filter:brightness(.55) saturate(.5) contrast(1.05)}
.leaflet-control-zoom a{background:var(--glass)!important;color:var(--ink)!important;border-color:#3C4B51!important}
.leaflet-control-attribution{background:rgba(20,28,32,.7)!important;color:var(--muted)!important;font-size:10px}
.leaflet-control-attribution a{color:#C7D2D6!important}
header{position:fixed;z-index:700;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none}
header>*{pointer-events:auto}
.brand,#status{background:var(--glass);border-radius:99px;padding:8px 15px}
.brand{font-weight:700;font-size:16px;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand span{color:var(--accent)}
#status{font-weight:600;font-size:13px}
#rail{position:fixed;z-index:700;left:14px;top:72px;display:flex;flex-direction:column;align-items:flex-start;gap:7px}
#rail button{border:0;border-radius:99px;background:var(--glass);padding:8px 14px;font-weight:500;white-space:nowrap}
#rail button[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:650}
#legend{position:fixed;z-index:700;right:14px;top:72px;background:var(--glass);border-radius:10px;padding:8px 10px;font-size:11.5px;line-height:1.7}
#legend b{display:block}
#legend i{display:inline-block;width:14px;height:10px;margin-right:6px;vertical-align:-1px;border-radius:2px}
#legend i.solid{border:1.5px solid var(--ink)}
#legend i.dash{border:1.5px dashed var(--ink)}
#legend i.pin{width:10px;height:10px;border-radius:50%;background:var(--accent)}
#card{position:fixed;z-index:700;right:14px;top:262px;width:310px;max-height:calc(100vh - 290px);overflow:auto;background:var(--glass);border-radius:12px;padding:12px 14px;line-height:1.5}
#card h2{margin:0 24px 2px 0;font-size:15px}
#card .meta{color:var(--muted);font-size:12.5px}
#card .score{display:flex;gap:8px;align-items:center;margin:6px 0}
#card .score b{font-size:22px}
#card .tag{border-radius:99px;padding:2px 8px;font-size:11.5px;font-weight:650;color:var(--accent-ink);background:#E8931C}
#card .tag.possible{background:#C9A24A}
#card .tag.longshot{background:#7E8C90;color:#fff}
#card .tag.t{background:none;border:1px solid var(--muted);color:var(--ink);font-weight:500}
#card ul{margin:4px 0 0;padding:0;list-style:none;font-size:12.5px}
#card li{display:flex;justify-content:space-between;gap:10px;padding:2px 0;border-bottom:1px solid #2E3B40}
#card li span:last-child{color:var(--accent);font-weight:650}
#card small{display:block;color:var(--muted);font-size:11.5px;line-height:1.4;margin-top:7px}
#card a{color:#F2C27A}
#card .x{position:absolute;top:6px;right:6px;width:30px;height:30px;border:0;background:none;font-size:18px;line-height:1}
#note,#empty{position:fixed;z-index:700;left:14px;bottom:14px;margin:0;background:var(--glass);border-radius:8px;padding:5px 10px;font-size:11.5px;color:var(--muted);max-width:calc(100vw - 210px)}
#empty{bottom:48px;color:var(--ink)}
.pin{display:grid;place-items:center;background:none;border:0}
.pin i{display:block;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 3px #000}
.pin.upcoming i{background:#fff;border-color:var(--accent)}
#fail{position:fixed;inset:0;z-index:800;display:grid;place-items:center;padding:24px;text-align:center}
@media(max-width:700px){
  .brand{font-size:13px;padding:7px 12px}
  #status{display:none}
  #rail{top:60px;left:0;right:0;padding:0 14px;flex-direction:row;overflow-x:auto;scrollbar-width:none}
  #legend{top:106px;font-size:10.5px;padding:6px 8px}
  #card{left:10px;right:10px;top:auto;bottom:10px;width:auto;max-height:55vh;font-size:13px}
  #note,#empty{left:10px;bottom:10px;font-size:10px;max-width:calc(100vw - 20px)}
  #empty{bottom:44px}
  body.card-open #note{display:none}
  .leaflet-control-zoom{display:none}
}
</style>
</head>
<body>
<div id="map"></div>
<header>
  <a class="brand" href="./" aria-label="BTOlab home">BTO<span>lab</span> · Future BTO</a>
  <div id="status" role="status">Loading…</div>
</header>
<nav id="rail" aria-label="Filter parcels"></nav>
<div id="legend">
  <b>Likelihood</b>
  <div><i style="background:#E8931C"></i>Likely (70+)</div>
  <div><i style="background:#C9A24A"></i>Possible (40–69)</div>
  <div><i style="background:#7E8C90"></i>Long shot (&lt;40)</div>
  <b style="margin-top:4px">Timeframe</b>
  <div><i class="solid"></i>≤ 5 years</div>
  <div><i class="dash"></i>5–10 years</div>
  <div><i class="pin"></i>BTO launched / upcoming</div>
</div>
<aside id="card" aria-label="Why this parcel" hidden></aside>
<p id="empty" role="status" hidden>No parcels match this filter.</p>
<p id="note"></p>
<div id="fail" hidden><p>Couldn't load the future BTO data.</p></div>
<script type="module" src="future-page.js"></script>

</body>
</html>
