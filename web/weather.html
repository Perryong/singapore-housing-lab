<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Singapore weather map: live wind, rain radar and temperature | BTOlab</title>
<link rel="canonical" href="https://singapore-housing-lab.vercel.app/web/weather.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2712%27 fill=%27%23E8931C%27/%3E%3C/svg%3E">
<meta name="description" content="Live Singapore weather on a map: animated wind, NEA rain radar, temperature and humidity, with every HDB BTO project pinned.">
<link rel="preload" href="fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
@font-face{font-family:"Schibsted Grotesk";font-weight:400 700;font-display:swap;src:url(fonts/schibsted-grotesk-latin.woff2) format("woff2")}
:root{--ink:#F4F7F6;--muted:#A9B6BB;--bg:#141C20;--glass:rgba(20,28,32,.88);--accent:#E8931C;--accent-ink:#2A1A00}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.4 "Schibsted Grotesk",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a,button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#map{position:fixed;inset:0;background:#1A2428;font:inherit}
#trails{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:450}
.leaflet-tile-pane{filter:brightness(.55) saturate(.5) contrast(1.05)}
.leaflet-control-zoom a{background:var(--glass)!important;color:var(--ink)!important;border-color:#3C4B51!important}
.leaflet-control-attribution{background:rgba(20,28,32,.7)!important;color:var(--muted)!important;font-size:10px}
.leaflet-control-attribution a{color:#C7D2D6!important}
header{position:fixed;z-index:700;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none}
header>*{pointer-events:auto}
.brand,#status{background:var(--glass);border-radius:99px;padding:8px 15px}
.brand{font-weight:700;font-size:16px;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand span{color:var(--accent)}
#status{font-weight:600;font-size:13px}
#status::before{content:"";display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:var(--accent);vertical-align:1px}
#status.live::before{background:#46C37B}
#rail{position:fixed;z-index:700;left:14px;top:72px;display:flex;flex-direction:column;align-items:flex-start;gap:7px}
#rail button{border:0;border-radius:99px;background:var(--glass);padding:8px 14px;font-weight:500;white-space:nowrap}
#rail button[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:650}
#legend{position:fixed;z-index:700;right:14px;top:72px;display:flex;gap:6px;font-size:11px;text-align:center}
#legend div{background:var(--glass);border-radius:10px;padding:6px;width:48px}
#legend b{display:block;margin-bottom:4px}
#legend i{display:block;font-style:normal;padding:2px 0;color:#fff;text-shadow:0 0 3px #000}
#legend i.flat{padding:0;height:7px}
#legend small{display:block;font-size:9.5px;color:var(--muted);padding:2px 0}
#card{position:fixed;z-index:700;right:124px;top:72px;width:290px;background:var(--glass);border-radius:12px;padding:12px 14px;line-height:1.5}
#card h2{margin:0 24px 3px 0;font-size:15px}
#card p{margin:0}
#card small{display:block;color:var(--muted);font-size:11.5px;line-height:1.4;margin-top:5px}
#card a{display:inline-block;margin-top:8px;background:var(--accent);color:var(--accent-ink);font-weight:650;padding:6px 12px;border-radius:8px;text-decoration:none}
#card button{position:absolute;top:6px;right:6px;width:30px;height:30px;border:0;background:none;font-size:18px;line-height:1}
#note{position:fixed;z-index:700;left:14px;bottom:14px;margin:0;background:var(--glass);border-radius:8px;padding:5px 10px;font-size:11.5px;color:var(--muted)}
.pin{display:grid;place-items:center;background:none;border:0}
.pin i{display:block;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 3px #000}
.pin.upcoming i{background:#fff;border-color:var(--accent)}
.pin.sel i{width:18px;height:18px}
#fail{position:fixed;inset:0;z-index:800;display:grid;place-items:center;padding:24px;text-align:center}
@media(max-width:700px){
  .brand,#status{font-size:13px;padding:7px 12px}
  #rail{top:60px;left:0;right:0;padding:0 14px;flex-direction:row;overflow-x:auto;scrollbar-width:none}
  #legend{top:108px;font-size:10px}
  #legend div{width:40px;padding:4px}
  #card{left:14px;right:14px;top:auto;bottom:62px;width:auto;padding:10px 12px;font-size:13px}
  #card a{margin-top:6px;padding:5px 10px}
  #note{left:14px;bottom:8px;right:auto;font-size:10px;padding:3px 8px;max-width:calc(100vw - 28px)}
  .leaflet-control-attribution{margin-bottom:30px!important;font-size:9px}
  .leaflet-control-zoom{display:none}
}
</style>
</head>
<body>
<div id="map"></div>
<canvas id="trails" aria-hidden="true"></canvas>
<header>
  <a class="brand" href="./" aria-label="BTOlab home">BTO<span>lab</span> weather</a>
  <div id="status" role="status">Loading live data…</div>
</header>
<nav id="rail" aria-label="Weather layers"></nav>
<div id="legend"></div>
<aside id="card" aria-label="Weather at this project" hidden></aside>
<p id="note">Measured at NEA stations and estimated between them.</p>
<script type="module" src="weather-page.js"></script>
<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "758f01fe2dda484692c8cae7b5f3ad74"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
